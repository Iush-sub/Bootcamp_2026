
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    
    <main>
        <div class="container">

        <section id="welcome-section">
            <!--We will be doing styling in css-->
            <h1 align="center"> Hello User</h1>
            <h2 align="center">Welcome to your task Manager</h2>
        </section>


        <section id="form-section">
            <form id="task-form">
                <label for="task-input" style="position: relative;">Enter Your Task</label>
                <div class="input-row">
                    <input id="task-input" type="text">
                    
                </div>

                <button id="addone" type="submit">Next task</button>
                <button id="cleartask" type="button">Clear</button>
                

            </form>

        </section>
        <section id="list-section">
                <ul id="task-list" >

                </ul>
               
        </section>
        </div>
    
    </main>
    <script src="scripts.js"></script>
    
</body>


</html>
